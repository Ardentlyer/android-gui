name: Android Emulator

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - gui
          - console
        required: false
        default: "gui"
      api_level:
        description: Android API level
        required: false
        default: "35"
      keep_alive_minutes:
        description: Minutes to keep the emulator alive after it starts
        type: number
        required: false
        default: 120

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DISPLAY: :99
      SCREEN_SIZE: 1280x800x24
      KEEP_ALIVE_MINUTES: ${{ github.event.inputs.keep_alive_minutes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install desktop, VNC, noVNC, and tunnel tools
        if: ${{ github.event.inputs.mode == 'gui' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fluxbox x11vnc novnc websockify curl libpulse0
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared

      - name: Install emulator runtime libraries
        if: ${{ github.event.inputs.mode != 'gui' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Start browser-accessible Android desktop
        if: ${{ github.event.inputs.mode == 'gui' }}
        run: |
          set -euo pipefail

          VNC_PASSWORD="$(openssl rand -base64 18)"
          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "### Android GUI connection info"
            echo ""
            echo "VNC password: \`$VNC_PASSWORD\`"
            echo ""
            echo "If a noVNC URL is not printed, use the tmate SSH command from the next step with port forwarding:"
            echo ""
            echo "\`\`\`bash"
            echo "ssh -L 6080:localhost:6080 USER@HOST"
            echo "\`\`\`"
            echo ""
            echo "Then open:"
            echo ""
            echo "http://localhost:6080/vnc.html?autoconnect=true&resize=scale"
          } >> "$GITHUB_STEP_SUMMARY"

          unset RUNNER_TRACKING_ID

          nohup Xvfb "$DISPLAY" -screen 0 "$SCREEN_SIZE" -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          sleep 2
          nohup fluxbox > /tmp/fluxbox.log 2>&1 &
          nohup x11vnc -display "$DISPLAY" -rfbport 5900 -forever -shared -passwd "$VNC_PASSWORD" -o /tmp/x11vnc.log > /tmp/x11vnc.stdout.log 2>&1 &

          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate > /tmp/cloudflared.log 2>&1 &
          disown || true

          for i in {1..60}; do
            NOVNC_URL="$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$NOVNC_URL" ] && curl -fsS "$NOVNC_URL/vnc.html" > /dev/null; then
              {
                echo "### Android GUI is starting"
                echo ""
                echo "noVNC URL: $NOVNC_URL/vnc.html?autoconnect=true&resize=scale"
                echo ""
                echo "VNC password: \`$VNC_PASSWORD\`"
                echo ""
                echo "The emulator window appears after the next step finishes booting Android."
              } >> "$GITHUB_STEP_SUMMARY"

              echo "============================================================"
              echo "Open this URL in your browser:"
              echo "$NOVNC_URL/vnc.html?autoconnect=true&resize=scale"
              echo
              echo "VNC password:"
              echo "$VNC_PASSWORD"
              echo "============================================================"
              exit 0
            fi
            sleep 2
          done

          echo "Cloudflare tunnel did not publish a URL in time. Continuing with tmate fallback."
          cat /tmp/cloudflared.log
          {
            echo ""
            echo "Cloudflare quick tunnel did not publish a URL. The workflow will continue with tmate."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open tmate console
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
          detached: true

      - name: Start Android emulator in GUI mode
        if: ${{ github.event.inputs.mode == 'gui' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: :99
        with:
          api-level: ${{ github.event.inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            adb devices
            adb shell getprop ro.build.version.release
            echo "Android GUI is ready. Keep this job running while you use noVNC."
            KEEP_ALIVE_SECONDS=$((KEEP_ALIVE_MINUTES * 60))
            sleep "$KEEP_ALIVE_SECONDS"

      - name: Start Android emulator in console mode
        if: ${{ github.event.inputs.mode != 'gui' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: |
            adb devices
            adb shell getprop ro.build.version.release
            echo "Android console mode is ready. Use the tmate console and run: adb devices"
            KEEP_ALIVE_SECONDS=$((KEEP_ALIVE_MINUTES * 60))
            sleep "$KEEP_ALIVE_SECONDS"
